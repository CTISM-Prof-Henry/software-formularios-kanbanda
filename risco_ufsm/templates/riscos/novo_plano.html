{% extends 'base_sistema.html' %}
{% block title %}Novo Plano de Risco{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Novo Plano de Risco</h1>
  <ol class="breadcrumb mb-0">
    <li class="breadcrumb-item"><a href="{% url 'painel' %}">Painel</a></li>
    <li class="breadcrumb-item"><a href="{% url 'riscos:lista_planos' %}">Riscos</a></li>
    <li class="breadcrumb-item active">Novo Plano</li>
  </ol>
</div>

<form method="post" novalidate>
  {% csrf_token %}

  {% include 'riscos/_form_secoes.html' %}

  <div class="d-flex gap-2 mb-4">
    <button type="submit" class="btn btn-primary">Salvar Plano de Risco</button>
    <a href="{% url 'riscos:lista_planos' %}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
